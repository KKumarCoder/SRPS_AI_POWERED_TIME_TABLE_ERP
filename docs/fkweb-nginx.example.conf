# Include inside a dedicated STAGING HTTPS server block with a real certificate.
# Replace the placeholders and verify nginx -t before deploying.
# Keep the existing device URL unchanged until external readiness tests pass.
location /biometric/fkweb/ {
    # Prefer restricting to the school's verified public egress IP:
    # allow SCHOOL_PUBLIC_IP;
    # deny all;
    # Capability URL contains a secret. Do not persist it in access/error logs.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1m;
    client_body_timeout 10s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:4000;
    proxy_read_timeout 20s;
}
# Do not expose other development routes on this dedicated receiver host.
location / { return 404; }
