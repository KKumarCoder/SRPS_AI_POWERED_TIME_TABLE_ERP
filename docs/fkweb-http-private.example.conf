# OPTIONAL HTTP-only device strategy: on-site relay or private VPN interface ONLY.
# This is NOT a configuration to expose public HTTP for the entire ERP.
# Replace placeholders, install a valid public TLS upstream, then run nginx -t.
server {
    listen SCHOOL_PRIVATE_RELAY_IP:8080;
    server_name _;
    access_log off;
    error_log /dev/null crit;
    location /biometric/fkweb/ {
        allow 192.168.1.224; # owner's confirmed device LAN IP; verify routing
        deny all;
        client_max_body_size 1m;
        client_body_timeout 10s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host STAGING_FKWEB_HOSTNAME;
        proxy_ssl_server_name on;
        proxy_ssl_name STAGING_FKWEB_HOSTNAME;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass https://STAGING_FKWEB_HOSTNAME;
    }
    location / { return 404; }
}
